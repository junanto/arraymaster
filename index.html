<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Master: Array Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <header>
            <h1>GRID MASTER: ARRAY ADVENTURE</h1>
            <div class="stats-bar">
                <div class="stat-box">NYAWA: <span id="lives-display">❤️❤️❤️</span></div>
                <div class="stat-box">SKOR: <span id="score-display">0</span></div>
            </div>
        </header>

        <div class="game-layout">
            <div class="grid-section">
                <table id="game-grid"></table>
            </div>

            <div class="control-section">
                <div class="panel current-task">
                    <h2>TUGAS SEKARANG</h2>
                    <p id="task-prompt">Loading...</p>
                </div>

                <div class="panel input-panel">
                    <div class="input-group">
                        <label for="row-input">BARIS (i):</label>
                        <input type="number" id="row-input" min="0" max="3" placeholder="0-3">
                    </div>
                    <div class="input-group">
                        <label for="col-input">KOLOM (j):</label>
                        <input type="number" id="col-input" min="0" max="3" placeholder="0-3">
                    </div>
                    <button id="check-btn" class="btn-primary">CHECK CELL</button>
                    <button id="reset-btn" class="btn-secondary">GAME BARU</button>
                </div>

                <div class="panel code-reference">
                    <h3>REFERENSI KODE</h3>
                    <div class="code-display">
                        <code>matrix[<span id="code-row">i</span>][<span id="code-col">j</span>]</code>
                    </div>
                </div>

                <div class="robot-feedback">
                    <p id="robot-speak">Halo! Mari kita mulai.</p>
                </div>
            </div>
        </div>

        <div class="leaderboard-section">
            <h3>🏆 TOP 5 LEADERBOARD</h3>
            <ol id="leaderboard-list">
                <li>Memuat data leaderboard...</li>
            </ol>
        </div>

        <div class="log-section">
            <h3>LOG AKTIVITAS</h3>
            <ul id="activity-log"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
